# Build Glimmer.dmg on every push, and publish a GitHub Release when a version tag is pushed.
#
#   • push to main / pull request → DMG uploaded as a workflow artifact (kept 90 days)
#   • push a tag like v1.2.0      → DMG built with version 1.2.0 and attached to a new Release
#   • Actions → "Build Glimmer" → Run workflow → enter an existing tag to (re)publish it
#
# Optional signing: add repository secrets MACOS_CERT_P12 (base64 of an exported .p12) and
# MACOS_CERT_PASSWORD. Without them the app is ad-hoc signed. See docs/releasing.md.

name: Build Glimmer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish as a Release (e.g. v1.1.0)"
        required: true

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    env:
      TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}
      HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Set version from tag
        if: env.TAG != ''
        run: |
          VERSION="${TAG#v}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Resources/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" Resources/Info.plist
          echo "Building Glimmer $VERSION"

      - name: Import signing certificate
        if: env.HAS_CERT == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p ci "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p ci "$KC"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"

      - name: Build DMG
        run: ./scripts/make-dmg.sh   # installs dmgbuild into .venv-dmg on first use

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glimmer-dmg
          path: |
            dist/*.dmg
            dist/*.sha256
          retention-days: 90

      - name: Write release notes
        if: env.TAG != ''
        run: |
          VERSION="${TAG#v}"
          SHA=$(cut -d' ' -f1 "dist/Glimmer.dmg.sha256")
          cat > dist/release-notes.md <<EOF
          **A glimmer of hope for every MacBook left in the dark.**

          Glimmer brings back screen brightness and the keyboard light on MacBooks where macOS has lost them — typically after a screen from another model or year was fitted (keyboard light on at the login screen, dark the moment you log in; brightness keys do nothing).

          ### Install
          1. Download **Glimmer.dmg** below (Glimmer $VERSION), open it and drag **Glimmer** onto **Applications**.
          2. Open Glimmer from Applications. If macOS says it can't be opened, go to **System Settings → Privacy & Security** and click **Open Anyway** (once — Glimmer isn't notarized).
          3. Click the ☀︎ in the menu bar. If it shows **Enable brightness keys…**, click it and allow Glimmer in **Privacy & Security → Accessibility**.

          Universal (Apple Silicon + Intel) · macOS 13 Ventura or later · MIT licensed

          SHA-256: \`$SHA\`
          EOF

      - name: Publish release
        if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Glimmer ${{ env.TAG }}
          body_path: dist/release-notes.md
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.sha256
